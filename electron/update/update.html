<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Froggi</title>
		<style>
			:root {
				--bg: #fbf0e5;
				--fg: #450d21;
				--muted: rgba(69, 13, 33, 0.45);
				--accent: #f9c22e;
				--border: rgba(69, 13, 33, 0.15);
				--hover-bg: rgba(69, 13, 33, 0.06);
			}

			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #1a1a1a;
					--fg: #d1d1d1;
					--muted: rgba(209, 209, 209, 0.45);
					--accent: #516650;
					--border: rgba(209, 209, 209, 0.12);
					--hover-bg: rgba(209, 209, 209, 0.06);
				}
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
				user-select: none;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			}

			body {
				background: var(--bg);
				color: var(--fg);
				width: 100vw;
				height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: space-between;
				padding: 14px 28px 20px;
				overflow: hidden;
			}

			.titlebar {
				width: 100%;
				display: flex;
				justify-content: flex-end;
				align-items: center;
				-webkit-app-region: drag;
				height: 20px;
				flex-shrink: 0;
			}

			.close-btn {
				width: 18px;
				height: 18px;
				border-radius: 50%;
				border: 1px solid var(--border);
				background: transparent;
				color: var(--muted);
				font-size: 9px;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				-webkit-app-region: no-drag;
				transition: background 0.15s, color 0.15s;
				line-height: 1;
			}

			.close-btn:hover {
				background: rgba(244, 67, 54, 0.15);
				color: #f44336;
				border-color: rgba(244, 67, 54, 0.3);
			}

			.main {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 6px;
				flex: 1;
				justify-content: center;
				width: 100%;
			}

			.logo {
				width: 52px;
				height: 52px;
				object-fit: contain;
				pointer-events: none;
				-webkit-user-drag: none;
				margin-bottom: 4px;
			}

			.app-name {
				font-size: 17px;
				font-weight: 700;
				letter-spacing: -0.2px;
			}

			.status {
				font-size: 12px;
				color: var(--muted);
				text-align: center;
				min-height: 16px;
				transition: opacity 0.25s;
			}

			.progress-track {
				width: 100%;
				height: 3px;
				background: var(--border);
				border-radius: 2px;
				overflow: hidden;
				opacity: 0;
				transition: opacity 0.3s;
				margin-top: 6px;
			}

			.progress-track.visible {
				opacity: 1;
			}

			.progress-fill {
				height: 100%;
				background: var(--accent);
				border-radius: 2px;
				width: 0%;
				transition: width 0.4s ease;
			}

			.progress-label {
				font-size: 11px;
				color: var(--muted);
				min-height: 14px;
				margin-top: 2px;
			}

			.actions {
				display: flex;
				gap: 8px;
				width: 100%;
				justify-content: center;
			}

			button.action {
				flex: 1;
				max-width: 120px;
				padding: 8px 0;
				border: 1px solid var(--border);
				border-radius: 6px;
				background: transparent;
				color: var(--fg);
				font-size: 12px;
				font-weight: 500;
				cursor: pointer;
				transition: background 0.15s, color 0.15s, border-color 0.15s, opacity 0.15s;
			}

			button.action:hover:not(:disabled) {
				background: var(--fg);
				color: var(--bg);
				border-color: var(--fg);
			}

			button.action:active:not(:disabled) {
				transform: scale(0.97);
			}

			button.action:disabled {
				opacity: 0.3;
				cursor: default;
				pointer-events: none;
			}

			button.action.primary {
				background: var(--fg);
				color: var(--bg);
				border-color: var(--fg);
			}

			button.action.primary:hover:not(:disabled) {
				opacity: 0.8;
			}
		</style>
	</head>
	<body>
		<div class="titlebar">
			<button class="close-btn" id="close-btn" title="Skip">✕</button>
		</div>
		<div class="main">
			<img class="logo" id="icon" src="icon.png" alt="Froggi" />
			<span class="app-name">Froggi</span>
			<span class="status" id="status-message">Checking for updates…</span>
			<div class="progress-track" id="progress-track">
				<div class="progress-fill" id="progress-fill"></div>
			</div>
			<span class="progress-label" id="progress-label"></span>
		</div>
		<div class="actions">
			<button class="action" id="skip-update">Skip</button>
			<button class="action primary" id="download-updates" disabled>Update</button>
		</div>
		<script defer src="renderer.js"></script>
	</body>
</html>
