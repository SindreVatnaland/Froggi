<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Froggi — Disconnected</title>
		<style>
			* { margin: 0; padding: 0; box-sizing: border-box; }

			body {
				background: transparent;
				width: 100vw;
				height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				padding: 1.5rem;
			}

			.card {
				display: flex;
				flex-direction: column;
				gap: 0.5rem;
				max-width: 340px;
			}

			.title {
				font-size: 1rem;
				font-weight: 700;
				color: #fff;
				text-shadow: 0 1px 4px rgba(0,0,0,0.8);
				letter-spacing: 0.01em;
			}

			.hint {
				font-size: 0.75rem;
				color: rgba(255,255,255,0.7);
				text-shadow: 0 1px 3px rgba(0,0,0,0.8);
				line-height: 1.5;
			}

			.status {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				margin-top: 0.25rem;
			}

			.dot {
				width: 7px;
				height: 7px;
				border-radius: 50%;
				background: #f87171;
				flex-shrink: 0;
				animation: pulse 1.4s ease-in-out infinite;
			}

			.dot--ok {
				background: #4ade80;
				animation: none;
			}

			.status-text {
				font-size: 0.7rem;
				color: rgba(255,255,255,0.55);
				text-shadow: 0 1px 3px rgba(0,0,0,0.8);
			}

			@keyframes pulse {
				0%, 100% { opacity: 1; }
				50% { opacity: 0.3; }
			}
		</style>
	</head>
	<body>
		<div class="card">
			<p class="title">Froggi Disconnected</p>
			<p class="hint">Make sure the Froggi app is open on the host device.</p>
			<p class="hint">If the IP changed, scan the QR code again from the dashboard.</p>
			<div class="status">
				<div class="dot" id="dot"></div>
				<span class="status-text" id="status">Reconnecting…</span>
			</div>
		</div>

		<script>
			const dot = document.getElementById('dot');
			const status = document.getElementById('status');
			let attempts = 0;

			async function checkAndReload() {
				const INTERVAL = 5000;
				while (true) {
					let countdown = INTERVAL / 1000;
					const timer = setInterval(() => {
						countdown--;
						if (countdown > 0) status.textContent = `Retrying in ${countdown}s (attempt ${attempts + 1})`;
					}, 1000);

					await new Promise(r => setTimeout(r, INTERVAL));
					clearInterval(timer);
					attempts++;
					status.textContent = `Checking… (attempt ${attempts})`;

					try {
						const res = await fetch('.', { cache: 'no-store' });
						if (res.status >= 200 && res.status < 500) {
							dot.classList.add('dot--ok');
							status.textContent = 'Reconnected — reloading…';
							await new Promise(r => setTimeout(r, 500));
							window.location.reload();
							return;
						}
					} catch {}

					status.textContent = `Retrying in ${INTERVAL / 1000}s (attempt ${attempts + 1})`;
				}
			}

			checkAndReload();
		</script>
	</body>
</html>
