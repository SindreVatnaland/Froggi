name: Build

on:
    workflow_call:
        inputs:
            runs-on:
                required: true
                type: string
            file:
                required: true
                type: string

jobs:
    deploy:
        timeout-minutes: 30
        runs-on: ${{ inputs['runs-on'] }}
        environment: production
        permissions: write-all
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Decode and import signing certificate
              if: runner.os == 'macOS'
              run: |
                  echo "${{ secrets.MACOS_CERTIFICATE }}" | base64 --decode > certificate.p12

                  echo "--- P12 file info ---"
                  ls -la certificate.p12
                  file certificate.p12
                  openssl pkcs12 -in certificate.p12 -noout -passin pass:"${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" 2>&1 && echo "P12 password OK" || echo "P12 password FAILED or corrupt file"

                  security create-keychain -p "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" build.keychain
                  security default-keychain -s build.keychain
                  security unlock-keychain -p "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" build.keychain
                  security set-keychain-settings -t 3600 -l ~/Library/Keychains/build.keychain

                  security import certificate.p12 -k build.keychain -P "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
                  echo "Import exit code: $?"

                  security set-key-partition-list -S apple-tool:,apple: -s -k "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" build.keychain
                  security list-keychains -d user -s build.keychain login.keychain

                  echo "--- All identities ---"
                  security find-identity -v
                  echo "--- Codesigning identities ---"
                  security find-identity -v -p codesigning
              env:
                  MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
                  MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

            - name: install dependencies
              run: npm ci --legacy-peer-deps --no-audit && npm ci --legacy-peer-deps --no-audit --prefix ./frontend

            - name: Test
              run: npm run test

            - name: build
              run: npm run build
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

            - uses: softprops/action-gh-release@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.PAT }}
              with:
                  files: ${{ inputs['file'] }}
                  draft: false
                  tag_name: ${{ github.ref_name }}
                  prerelease: ${{ contains(github.ref_name, 'beta') }}
                  fail_on_unmatched_files: false
