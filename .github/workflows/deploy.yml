name: Build

on:
    workflow_call:
        inputs:
            runs-on:
                required: true
                type: string
            file:
                required: true
                type: string
            tag:
                required: false
                type: string
                default: ''

jobs:
    deploy:
        timeout-minutes: 30
        runs-on: ${{ inputs['runs-on'] }}
        environment: production
        permissions: write-all
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            # node-gyp (sqlite3 native build) imports distutils, removed from Python 3.12+.
            # Runners now default to Python 3.14, breaking the build — pin 3.11 which has it.
            - name: Setup Python (for node-gyp)
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Cache node_modules
              id: cache-deps
              uses: actions/cache@v4
              with:
                  path: |
                      node_modules
                      frontend/node_modules
                  # v2: bust caches from the failed beta.10 run that saved a partial node_modules
                  key: ${{ runner.os }}-deps-v2-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
                  restore-keys: ${{ runner.os }}-deps-v2-

            - name: Cache Electron binaries (Linux/macOS)
              if: runner.os != 'Windows'
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/electron
                      ~/.cache/electron-builder
                  # Keyed on the toolchain (electron/electron-builder versions), NOT the app
                  # version — otherwise every release bump re-downloads the flaky GitHub binaries.
                  key: ${{ runner.os }}-electron-v1
                  restore-keys: ${{ runner.os }}-electron-

            - name: Cache Electron binaries (Windows)
              if: runner.os == 'Windows'
              uses: actions/cache@v4
              with:
                  path: |
                      ~/AppData/Local/electron/Cache
                      ~/AppData/Local/electron-builder/Cache
                  key: ${{ runner.os }}-electron-v1
                  restore-keys: ${{ runner.os }}-electron-

            - name: Decode and import signing certificate
              if: runner.os == 'macOS'
              run: |
                  echo "${{ secrets.MACOS_CERTIFICATE }}" | base64 --decode > certificate.p12

                  echo "--- P12 file info ---"
                  ls -la certificate.p12
                  file certificate.p12
                  openssl pkcs12 -in certificate.p12 -noout -passin pass:"${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" 2>&1 && echo "P12 password OK" || echo "P12 password FAILED or corrupt file"

                  security create-keychain -p "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" build.keychain
                  security default-keychain -s build.keychain
                  security unlock-keychain -p "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" build.keychain
                  security set-keychain-settings -t 3600 -l ~/Library/Keychains/build.keychain

                  security import certificate.p12 -k build.keychain -P "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
                  echo "Import exit code: $?"

                  security set-key-partition-list -S apple-tool:,apple: -s -k "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" build.keychain
                  security list-keychains -d user -s build.keychain login.keychain

                  echo "--- All identities ---"
                  security find-identity -v
                  echo "--- Codesigning identities ---"
                  security find-identity -v -p codesigning
              env:
                  MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
                  MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

            - name: install dependencies
              if: steps.cache-deps.outputs.cache-hit != 'true'
              run: npm ci --legacy-peer-deps --no-audit && npm ci --legacy-peer-deps --no-audit --prefix ./frontend

            - name: Test
              if: runner.os == 'Linux'
              run: npm run test

            - name: build
              run: npm run build
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  # Baked into the app so users can opt into crash reports / feedback. Empty if unset.
                  DISCORD_USER_CRASH_REPORT_WEBHOOK: ${{ secrets.DISCORD_USER_CRASH_REPORT_WEBHOOK }}
                  DISCORD_USER_FEATURE_REPORT_WEBHOOK: ${{ secrets.DISCORD_USER_FEATURE_REPORT_WEBHOOK }}
                  # Public lobby invites + Discord Rich Presence app id. Empty if unset.
                  DISCORD_PUBLIC_GAME_WEBHOOK: ${{ secrets.DISCORD_PUBLIC_GAME_WEBHOOK }}
                  DISCORD_FROGGI_CLIENT_ID: ${{ secrets.DISCORD_FROGGI_CLIENT_ID }}

            - uses: softprops/action-gh-release@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.PAT }}
              with:
                  files: ${{ inputs['file'] }}
                  draft: false
                  tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
                  prerelease: ${{ contains(inputs.tag != '' && inputs.tag || github.ref_name, 'beta') }}
                  fail_on_unmatched_files: false
